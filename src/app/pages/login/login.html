<!-- Vista de inicio de sesión: recoge correo y contraseña y muestra el resultado del intento. -->
<section class="login">
  <h2>Iniciar sesión</h2>
  <p>Ingresá con el correo y la contraseña de tu cuenta.</p>

  <!-- #formulario="ngForm" obtiene su estado de validación; (ngSubmit) lo pasa al método de login.ts. -->
  <form #formulario="ngForm" (ngSubmit)="iniciarSesion(formulario)">
    <!-- Deshabilita el conjunto durante la solicitud. Cada name registra un control y ngModel sincroniza su valor. -->
    <fieldset [disabled]="cargando()">
      <legend>Datos de acceso</legend>

      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        [(ngModel)]="email"
        required
        email
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        required
      />

      <!-- El operador condición ? texto1 : texto2 cambia el mensaje mientras se espera la respuesta. -->
      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </fieldset>

    <!-- La señal vacía no muestra este bloque; role alert anuncia el error de forma accesible. -->
    @if (mensajeError()) {
      <p class="error" role="alert">{{ mensajeError() }}</p>
    }
  </form>

  <p class="registro">
    ¿Todavía no tenés cuenta?
    <a routerLink="/registro">Registrate</a>
  </p>
</section>
