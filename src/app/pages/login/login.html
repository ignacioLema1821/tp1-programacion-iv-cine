<section class="login">
  <h2>Iniciar sesión</h2>
  <p>Ingresá con el correo y la contraseña de tu cuenta.</p>

  <!-- Angular controla los campos y ejecuta el método al enviar. -->
  <form #formulario="ngForm" (ngSubmit)="iniciarSesion(formulario)">
    <fieldset [disabled]="cargando()">
      <legend>Datos de acceso</legend>

      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        [(ngModel)]="email"
        required
        email
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        required
      />

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </fieldset>

    @if (mensajeError()) {
      <p class="error" role="alert">{{ mensajeError() }}</p>
    }
  </form>

  <p class="registro">
    ¿Todavía no tenés cuenta?
    <a routerLink="/registro">Registrate</a>
  </p>
</section>
