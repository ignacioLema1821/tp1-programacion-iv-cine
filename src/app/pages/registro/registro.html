<!-- Vista de registro: ngModel conecta los campos con datos y el componente agrega validaciones antes de crear la cuenta. -->
<section class="registro">
  <h2>Crear una cuenta</h2>
  <p>Completá tus datos para registrarte en CineApp.</p>

  <!-- Si el registro terminó correctamente se presenta el mensaje; @else conserva el formulario mientras falta completarlo. -->
  @if (mensajeExito()) {
    <p class="exito" role="status">{{ mensajeExito() }}</p>
  } @else {
    <!-- NgForm reúne el estado de los campos; ngSubmit entrega ese formulario a registrar en registro.ts. -->
    <form #formulario="ngForm" (ngSubmit)="registrar(formulario)">
      <!-- Bloquea el formulario mientras se envía. name registra cada campo y required lo marca como obligatorio. -->
      <fieldset [disabled]="cargando()">
        <legend>Datos de tu cuenta</legend>

        <label for="nombre">Nombre</label>
        <input
          id="nombre"
          name="nombre"
          type="text"
          autocomplete="given-name"
          [(ngModel)]="datos.nombre"
          required
        />

        <label for="apellido">Apellido</label>
        <input
          id="apellido"
          name="apellido"
          type="text"
          autocomplete="family-name"
          [(ngModel)]="datos.apellido"
          required
        />

        <!-- type email ayuda al navegador; la directiva email agrega la validación de correo al formulario de Angular. -->
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          [(ngModel)]="datos.email"
          required
          email
        />

        <!-- [max] limita la fecha a hoy; el componente también rechaza una fecha futura antes de enviar. -->
        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input
          id="fechaNacimiento"
          name="fechaNacimiento"
          type="date"
          autocomplete="bday"
          [max]="fechaActual"
          [(ngModel)]="datos.fechaNacimiento"
          required
        />

        <label for="tipoSangre">Tipo de sangre</label>
        <select id="tipoSangre" name="tipoSangre" [(ngModel)]="datos.tipoSangre" required>
          <option value="">Seleccioná una opción</option>
          <!-- @for crea opciones con los grupos definidos en TypeScript; track tipo identifica cada opción por su texto. -->
          @for (tipo of tiposSangre; track tipo) {
            <option [value]="tipo">{{ tipo }}</option>
          }
        </select>

        <label for="colorOjos">Color de ojos</label>
        <input id="colorOjos" name="colorOjos" type="text" [(ngModel)]="datos.colorOjos" required />

        <label for="diasVacaciones">Días de vacaciones por año</label>
        <input
          id="diasVacaciones"
          name="diasVacaciones"
          type="number"
          min="0"
          step="1"
          [(ngModel)]="datos.diasVacaciones"
          required
        />

        <!-- minlength exige ocho caracteres. TypeScript compara contraseña y confirmación porque esa regla depende de ambos campos. -->
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="new-password"
          [(ngModel)]="password"
          required
          minlength="8"
          aria-describedby="ayudaPassword"
        />
        <small id="ayudaPassword">Usá al menos 8 caracteres.</small>

        <label for="confirmarPassword">Repetir contraseña</label>
        <input
          id="confirmarPassword"
          name="confirmarPassword"
          type="password"
          autocomplete="new-password"
          [(ngModel)]="confirmarPassword"
          required
        />

        <!-- El envío llama a registrar; el ternario cambia el texto y disabled impide repetir clics mientras se procesa. -->
        <button type="submit" [disabled]="cargando()">
          {{ cargando() ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>
      </fieldset>

      @if (mensajeError()) {
        <p class="error" role="alert">{{ mensajeError() }}</p>
      }
    </form>
  }
</section>
